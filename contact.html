<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Altrum Capital</title>
<meta name="description" content="Get in touch with Altrum Capital, Hooghly, West Bengal, for a free financial planning consultation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="images/logo-icon.png">
</head>
<body>

<div class="ledger-bg" aria-hidden="true"></div>

<script src="js/header.js"></script>

<!-- PAGE HEADER -->
<section class="page-header">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">Home</a> / Contact</div>
    <span class="eyebrow">Get In Touch</span>
    <h1>Let's talk about your goals.</h1>
  </div>
</section>

<!-- CONTACT -->
<section class="section-pad" style="padding-top:20px;">
  <div class="wrap contact-grid">
    <div class="contact-info reveal">
      <p>Based in Hooghly, working with clients across West Bengal. Reach out for a no-obligation first conversation.</p>

      <div class="info-row">
        <div class="info-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div><h4>Office</h4><p>Altrum Capital, G.T. Road, Hooghly, West Bengal – 712103</p></div>
      </div>
      <div class="info-row">
        <div class="info-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92Z"/></svg></div>
        <div><h4>Phone</h4><p>+91 98300 00000</p></div>
      </div>
      <div class="info-row">
        <div class="info-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></div>
        <div><h4>Email</h4><p>hello@altrumcapital.in</p></div>
      </div>
    </div>

    <form class="form-card reveal">
      <div class="form-row-2">
        <div class="form-row"><label for="fName">Full Name</label><input id="fName" type="text" required placeholder="Your name"></div>
        <div class="form-row"><label for="fPhone">Phone</label><input id="fPhone" type="tel" required placeholder="+91"></div>
      </div>
      <div class="form-row"><label for="fEmail">Email</label><input id="fEmail" type="email" required placeholder="you@example.com"></div>
      <div class="form-row"><label for="fMsg">What would you like help with?</label><textarea id="fMsg" rows="4" placeholder="Retirement planning, SIPs, insurance review..."></textarea></div>
      <button type="submit" class="btn btn-primary">Request a Call Back</button>
    </form>
  </div>
</section>

<!-- FOOTER -->
<script src="js/footer.js"></script>

<script src="js/amc-data.js"></script>
<script src="js/amc-menu.js"></script>
<script src="js/main.js"></script>
</body>
</html>
